name: Reproduce NVIDIA 580 Proprietary KMS focused3 diagnostics

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to rebuild
        type: choice
        required: true
        options:
          - epyc7002
          - epyc7003
          - both
        default: both

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platform == 'both' && '["epyc7002","epyc7003"]' || format('["{0}"]', inputs.platform)) }}
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify NVIDIA 580.173.02 source
        shell: bash
        run: |
          mkdir -p run
          curl -fL --retry 3 \
            -o run/NVIDIA-Linux-x86_64-580.173.02.run \
            https://us.download.nvidia.com/XFree86/Linux-x86_64/580.173.02/NVIDIA-Linux-x86_64-580.173.02.run
          echo '8d8eb9001e05a9a8a663d3d5d304feb64ef2844ee185ccdfd952786820f46e1b  run/NVIDIA-Linux-x86_64-580.173.02.run' | sha256sum -c -

      - name: Build and validate focused3 diagnostic
        shell: bash
        run: scripts/build-nvidia-kms-focused3.sh '${{ matrix.platform }}'

      - name: Upload diagnostic candidate and build log
        uses: actions/upload-artifact@v4
        with:
          name: nvidia-580.173.02-proprietary-kms-focused3-${{ matrix.platform }}
          path: out/kms-focused3-repro/**/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 30
