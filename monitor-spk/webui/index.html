<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NVIDIA GPU Monitor</title><style>body{font:14px system-ui;background:#101827;color:#eef;margin:0;padding:24px}main{max-width:760px;margin:auto}h1{font-size:24px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:#17243a;border-radius:12px;padding:18px}.v{font-size:28px;color:#5ee7ff;margin-top:8px}small{color:#9fb0c8}canvas{width:100%;height:44px;margin-top:10px}</style><main><h1 style="display:flex;align-items:center;gap:10px"><img src="images/icon_256.png" width="32" height="32" alt="GPU">NVIDIA GPU Monitor</h1><p><small>NVML telemetry · 5-second refresh · 50-slot scrolling history</small></p><section class="grid" id="cards"></section></main><script>const fields=[['gpu_utilization','GPU Utilization','%'],['gpu_memory_utilization','VRAM Utilization','%'],['encoder_utilization','NVENC Utilization','%'],['decoder_utilization','NVDEC Utilization','%'],['temperature_c','GPU Temperature','°C'],['fan_speed','Fan Speed','%'],['gpu_clock_mhz','GPU Clock','MHz'],['memory_clock_mhz','Memory Clock','MHz']],hist=[];function graph(c,vals){let x=c.getContext('2d'),w=c.width=c.clientWidth*2,h=c.height=c.clientHeight*2;x.clearRect(0,0,w,h);x.strokeStyle='#35d0ff';x.lineWidth=3;x.beginPath();vals.forEach((v,i)=>{let px=(50-vals.length+i)*w/49,py=h-(Math.min(100,Math.max(0,v))/100*h);i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke()}async function refresh(){try{let d=await (await fetch('./api.cgi',{cache:'no-store'})).json();hist.push(d);if(hist.length>50)hist.shift();let used=(d.gpu_memory_used/1024).toFixed(0),total=(d.gpu_memory_total/1024).toFixed(0);cards.innerHTML=fields.map(([k,n,u])=>`<div class=card><small>${n}</small><div class=v>${k==='gpu_utilization'||k==='encoder_utilization'||k==='decoder_utilization'?Math.round(hist.reduce((s,z)=>s+Number(z[k]||0),0)/hist.length):(d[k]??'N/A')} ${u}${k==='gpu_memory_utilization'?`<br><small>${used} MiB / ${total} MiB</small>`:''}${k==='gpu_utilization'||k==='encoder_utilization'||k==='decoder_utilization'?`<canvas id="g-${k}"></canvas>`:''}</div></div>`).join('');['gpu_utilization','encoder_utilization','decoder_utilization'].forEach(k=>graph(document.getElementById('g-'+k),hist.map(z=>Number(z[k]||0))))}catch(e){cards.innerHTML='<div class=card>Telemetry unavailable</div>'}}refresh();setInterval(refresh,5000)</script>
