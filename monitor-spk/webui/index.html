<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NVIDIA GPU Monitor</title><style>body{font:14px system-ui;background:#101827;color:#eef;margin:0;padding:24px}main{max-width:760px;margin:auto}h1{font-size:24px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:#17243a;border-radius:12px;padding:18px}.v{font-size:28px;color:#5ee7ff;margin-top:8px}small{color:#9fb0c8}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style>
<main><h1>NVIDIA GPU Monitor</h1><p><small>NVML telemetry · 5초 갱신</small></p><section class="grid" id="cards"></section></main>
<script>const fields=[['gpu_utilization','GPU 사용률','%'],['gpu_memory_utilization','VRAM 사용률','%'],['encoder_utilization','NVENC','%'],['decoder_utilization','NVDEC','%'],['gpu_memory_used','VRAM 사용량','KiB'],['gpu_memory_total','VRAM 전체','KiB']];async function refresh(){try{let r=await fetch('/webapi/SYNO.NvidiaGpuMonitor',{cache:'no-store'}),d=await r.json();cards.innerHTML=fields.map(([k,n,u])=>`<div class=card><small>${n}</small><div class=v>${d[k]??'N/A'} ${u}</div></div>`).join('')}catch(e){cards.innerHTML='<div class=card>telemetry unavailable</div>'}}refresh();setInterval(refresh,5000)</script>
