<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NVIDIA GPU Monitor</title><style>body{font:14px system-ui;background:#101827;color:#eef;margin:0;padding:24px}main{max-width:760px;margin:auto}h1{font-size:24px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:#17243a;border-radius:12px;padding:18px}.v{font-size:28px;color:#5ee7ff;margin-top:8px}small{color:#9fb0c8}</style><main><h1 style="display:flex;align-items:center;gap:10px"><img src="images/icon_256.png" width="32" height="32" alt="GPU">NVIDIA GPU Monitor</h1><p><small>NVML telemetry · 5-second refresh · 10-sample moving average</small></p><section class="grid" id="cards"></section></main><script>const fields=[['gpu_utilization','GPU Utilization','%'],['gpu_memory_utilization','VRAM Utilization','%'],['encoder_utilization','NVENC Utilization','%'],['decoder_utilization','NVDEC Utilization','%'],['temperature_c','GPU Temperature','°C'],['fan_speed','Fan Speed','%'],['gpu_clock_mhz','GPU Clock','MHz'],['memory_clock_mhz','Memory Clock','MHz']],hist=[];async function refresh(){try{let d=await (await fetch('./api.cgi',{cache:'no-store'})).json();hist.push(d);if(hist.length>10)hist.shift();let avg=k=>Math.round(hist.reduce((s,x)=>s+Number(x[k]||0),0)/hist.length),used=(d.gpu_memory_used/1024).toFixed(0),total=(d.gpu_memory_total/1024).toFixed(0);cards.innerHTML=fields.map(([k,n,u])=>`<div class=card><small>${n}</small><div class=v>${avg(k)} ${u}${k==='gpu_memory_utilization'?`<br><small>${used} MiB / ${total} MiB</small>`:''}</div></div>`).join('')}catch(e){cards.innerHTML='<div class=card>Telemetry unavailable</div>'}}refresh();setInterval(refresh,5000)</script>
